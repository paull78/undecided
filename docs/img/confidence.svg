<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="319" rx="14" fill="#fbfbf9" stroke="#e3e3dc"/>

  <!-- Top strip: a stated percentage and what it should mean -->
  <path d="M32,30 H160 A8,8 0 0 1 168,38 V70 A8,8 0 0 1 160,78 H70 L54,92 L56,78 H32 A8,8 0 0 1 24,70 V38 A8,8 0 0 1 32,30 Z" fill="#e7effa" stroke="#2563b8" stroke-width="1.5"/>
  <text x="96" y="60" font-size="17" font-weight="bold" fill="#2563b8" text-anchor="middle">90% sure</text>

  <line x1="184" y1="54" x2="290" y2="54" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <g stroke="#2563b8" stroke-width="2">
    <circle cx="318" cy="54" r="10" fill="#2563b8"/>
    <circle cx="348" cy="54" r="10" fill="#2563b8"/>
    <circle cx="378" cy="54" r="10" fill="#2563b8"/>
    <circle cx="408" cy="54" r="10" fill="#2563b8"/>
    <circle cx="438" cy="54" r="10" fill="#2563b8"/>
    <circle cx="468" cy="54" r="10" fill="#2563b8"/>
    <circle cx="498" cy="54" r="10" fill="#2563b8"/>
    <circle cx="528" cy="54" r="10" fill="#2563b8"/>
    <circle cx="558" cy="54" r="10" fill="#2563b8"/>
    <circle cx="588" cy="54" r="10" fill="#fbfbf9"/>
  </g>
  <text x="453" y="90" font-size="12.5" fill="#6a6f76" text-anchor="middle">right 9 times in 10</text>
  <text x="626" y="60" font-size="17" font-weight="bold" fill="#1f2328">honest</text>

  <line x1="24" y1="116" x2="776" y2="116" stroke="#eef0f2" stroke-width="1.5"/>

  <!-- Main chart -->
  <text x="24" y="146" font-size="15" font-weight="bold" fill="#1f2328">On new data: how far the percentages are from reality (points, lower is better)</text>

  <g font-size="15" fill="#1f2328" text-anchor="end">
    <text x="330" y="188">As it comes</text>
    <text x="330" y="228">One shared correction for all datasets</text>
    <text x="330" y="268">A correction per dataset, from 200 examples</text>
  </g>

  <rect x="350" y="170" width="320" height="26" rx="4" fill="#8c939b"/>
  <rect x="350" y="210" width="280" height="26" rx="4" fill="#8c939b"/>
  <rect x="350" y="250" width="120" height="26" rx="4" fill="#2563b8"/>

  <g font-size="15" font-weight="bold">
    <text x="680" y="188" fill="#1f2328">16</text>
    <text x="640" y="228" fill="#1f2328">14</text>
    <text x="480" y="268" fill="#2563b8">6</text>
  </g>

  <line x1="350" y1="162" x2="350" y2="284" stroke="#57606a" stroke-width="1.5"/>
  <text x="350" y="302" font-size="12.5" fill="#6a6f76" text-anchor="middle">0 = perfectly honest</text>
</svg>
