<svg xmlns="http://www.w3.org/2000/svg" width="800" height="266" viewBox="0 0 800 266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="265" rx="14" fill="#fbfbf9" stroke="#e3e3dc"/>

  <g transform="translate(0,6)">
  <!-- LEFT: inputs -->
  <g font-size="12.5" fill="#6a6f76" letter-spacing="0.6">
    <text x="24" y="34">TEXT</text>
    <text x="24" y="108">OPTIONS (YOU CHOOSE THEM)</text>
    <text x="24" y="182">INSTRUCTION (OPTIONAL)</text>
  </g>

  <rect x="24" y="42" width="276" height="40" rx="8" fill="#ffffff" stroke="#8c939b"/>
  <text x="38" y="67" font-size="15" fill="#1f2328">My card was charged twice.</text>

  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <rect x="24" y="116" width="78" height="32" rx="16" fill="#eef0f2" stroke="#8c939b"/>
    <text x="63" y="137">billing</text>
    <rect x="108" y="116" width="108" height="32" rx="16" fill="#eef0f2" stroke="#8c939b"/>
    <text x="162" y="137">bug report</text>
    <rect x="222" y="116" width="78" height="32" rx="16" fill="#eef0f2" stroke="#8c939b"/>
    <text x="261" y="137">praise</text>
  </g>

  <rect x="24" y="190" width="276" height="40" rx="8" fill="#ffffff" stroke="#6a6f76" stroke-dasharray="5 4"/>
  <text x="38" y="215" font-size="15" fill="#1f2328">Classify the support ticket.</text>

  <!-- MIDDLE: arrows in, model box, arrow out -->
  <g fill="none" stroke="#57606a" stroke-width="2">
    <path d="M306,62 C328,62 316,112 342,112" marker-end="url(#arrow)"/>
    <path d="M306,132 L342,132" marker-end="url(#arrow)"/>
    <path d="M306,210 C328,210 316,152 342,152" marker-end="url(#arrow)"/>
    <path d="M466,132 L490,132" marker-end="url(#arrow)"/>
  </g>

  <rect x="344" y="94" width="120" height="76" rx="8" fill="#2563b8"/>
  <text x="404" y="128" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">undecided</text>
  <text x="404" y="150" font-size="12.5" fill="#ffffff" text-anchor="middle">reads it all once</text>

  <!-- RIGHT: result bars -->
  <g font-size="15" fill="#1f2328">
    <text x="500" y="99">billing</text>
    <text x="500" y="137">bug report</text>
    <text x="500" y="175">praise</text>
  </g>

  <rect x="590" y="86" width="106" height="16" rx="4" fill="#eef0f2"/>
  <rect x="590" y="86" width="98.6" height="16" rx="4" fill="#2563b8"/>
  <rect x="590" y="124" width="106" height="16" rx="4" fill="#eef0f2"/>
  <rect x="590" y="124" width="7.4" height="16" rx="2" fill="#8fb0dd"/>
  <rect x="590" y="162" width="106" height="16" rx="4" fill="#eef0f2"/>
  <rect x="590" y="162" width="1.2" height="16" fill="#8fb0dd"/>

  <g font-size="15" fill="#1f2328">
    <text x="706" y="99" font-weight="bold">93%</text>
    <text x="706" y="137">7%</text>
    <text x="706" y="175">under 1%</text>
  </g>

  <text x="500" y="208" font-size="12.5" fill="#6a6f76">the percentages add up to 100%</text>
  </g>
</svg>
