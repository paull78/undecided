# Control for diverse-warm: the same start (poc) and the same number of steps, on poc's own six
# tasks with no recasting. Any gain diverse-warm has over this run comes from the task mix, not
# from more training.
name: poc-warm
backbone: answerdotai/ModernBERT-base
init_from: runs/poc
seed: 0  # also fixes the evaluation samples, so they match poc exactly
data:
  train: {ag_news: 5000, emotion: 5000, banking77: 5000, trec: 5000, sst2: 5000, mnli: 5000}
  eval: {ag_news: 1000, emotion: 1000, banking77: 1000, trec: 500, sst2: 872, mnli: 1000,
         yahoo_answers: 1000, massive: 1000, tweet_irony: 784,
         sms_spam: 1000, tweet_hate: 1000, subjectivity: 1000}
train:
  epochs: 1
  batch_size: 16
  max_length: 512
  max_options: 16
  augment: true
