# Closing day, step D: question 5, first half. poc's data and schedule, from plain ModernBERT, with
# the encoder and the <opt> vector frozen: only Linear(768, 1) learns. Compared with poc.
name: head-only
backbone: answerdotai/ModernBERT-base
seed: 0
data:
  train: {ag_news: 5000, emotion: 5000, banking77: 5000, trec: 5000, sst2: 5000, mnli: 5000}
  eval: {ag_news: 1000, emotion: 1000, banking77: 1000, trec: 500, sst2: 872, mnli: 1000,
         yahoo_answers: 1000, massive: 1000, tweet_irony: 784,
         sms_spam: 1000, tweet_hate: 1000, subjectivity: 1000}
train:
  epochs: 2
  batch_size: 16
  max_length: 512
  max_options: 16
  augment: true
  freeze_encoder: true
