name: diverse-warm
backbone: answerdotai/ModernBERT-base
init_from: runs/poc
seed: 0
data:
  train:
    ag_news: 3000
    emotion: 3000
    banking77: 3000
    trec: 3000
    sst2: 3000
    mnli: 3000
    qqp: 3000
    qnli: 3000
    cola: 3000
    boolq: 3000
  eval:
    ag_news: 1000
    emotion: 1000
    banking77: 1000
    trec: 500
    sst2: 872
    mnli: 1000
    yahoo_answers: 1000
    massive: 1000
    tweet_irony: 784
    sms_spam: 1000
    tweet_hate: 1000
    subjectivity: 1000
    qqp: 1000
    qnli: 1000
    cola: 1000
    boolq: 1000
train:
  epochs: 1
  batch_size: 16
  head_lr: 0.001
  encoder_lr: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  max_length: 512
  max_options: 16
  augment: true
  recast_rate: 0.25
  seed: 0
  max_steps: null
